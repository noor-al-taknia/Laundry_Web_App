<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#173b85" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Pearl Laundry | Temporarily unavailable</title>
    <meta
      name="description"
      content="Pearl Laundry is carrying out a brief website update. Please come back shortly."
    />
    <style>
      :root {
        color-scheme: light;
        --navy: #173b85;
        --blue: #285bd4;
        --ink: #17264c;
        --muted: #60718e;
        --line: #dce8fb;
        --orange: #ffad53;
      }

      * { box-sizing: border-box; }

      html, body { min-height: 100%; }

      body {
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 14% 14%, #fff 0 2.5%, transparent 2.8%),
          radial-gradient(circle at 88% 82%, #cfe0ff 0 8%, transparent 8.3%),
          linear-gradient(145deg, #f6faff, #e5efff);
        font-family: Arial, Tahoma, sans-serif;
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px;
      }

      .card {
        width: min(100%, 590px);
        padding: 42px;
        text-align: center;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid var(--line);
        border-radius: 28px;
        box-shadow: 0 24px 70px rgba(36, 74, 131, 0.13);
        backdrop-filter: blur(12px);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 11px;
        margin-bottom: 26px;
        text-align: start;
        font-weight: 800;
        letter-spacing: 0.01em;
      }

      .brand-mark {
        display: grid;
        place-items: center;
        width: 46px;
        height: 50px;
        color: #fff;
        background: var(--blue);
        border-radius: 14px;
        font-size: 18px;
      }

      .brand small {
        display: block;
        margin-top: 3px;
        color: #6b7c98;
        font-size: 9px;
        letter-spacing: 0.12em;
      }

      .illustration {
        position: relative;
        height: 235px;
        max-width: 390px;
        margin: 0 auto 28px;
        overflow: hidden;
        background: linear-gradient(145deg, #cce1ff, #edf5ff);
        border-radius: 43% 47% 35% 45%;
      }

      .machine {
        position: absolute;
        bottom: 23px;
        left: 50%;
        width: 112px;
        height: 130px;
        background: #fff;
        border: 4px solid var(--blue);
        border-radius: 13px;
        transform: translateX(-50%);
      }

      .machine::before {
        content: "";
        display: block;
        width: calc(100% - 24px);
        height: 9px;
        margin: 12px;
        background: var(--blue);
        border-radius: 4px;
      }

      .door {
        width: 75px;
        height: 75px;
        margin: 6px auto;
        overflow: hidden;
        background: var(--navy);
        border: 6px solid #9abbf0;
        border-radius: 50%;
      }

      .wash {
        display: block;
        width: 100%;
        height: 100%;
        background: conic-gradient(#d9f3ff, #5d91e8, #d9f3ff);
        border-radius: 50%;
        animation: spin 3s linear infinite;
      }

      .bubble {
        position: absolute;
        width: 20px;
        height: 20px;
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid #fff;
        border-radius: 50%;
        animation: float 3.5s ease-in-out infinite;
      }

      .bubble.one { top: 24%; left: 18%; }
      .bubble.two { top: 18%; right: 17%; width: 31px; height: 31px; animation-delay: -1s; }
      .bubble.three { bottom: 25%; left: 28%; width: 14px; height: 14px; animation-delay: -2s; }
      .wrench, .spark { position: absolute; z-index: 2; }
      .wrench { top: 25%; left: 18%; color: var(--orange); font-size: 54px; transform: rotate(-35deg); }
      .spark { top: 33%; right: 19%; color: var(--blue); font-size: 32px; }

      .eyebrow {
        margin: 0 0 13px;
        color: var(--blue);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
      }

      h1 {
        margin: 0 auto 15px;
        font-size: clamp(31px, 6vw, 48px);
        line-height: 1.08;
        letter-spacing: -0.035em;
      }

      .message {
        max-width: 430px;
        margin: 0 auto 25px;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.7;
      }

      .actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .contact, .language {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 12px 20px;
        border-radius: 10px;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
      }

      .contact { color: #fff; background: var(--blue); }
      .contact:hover { background: #1747b8; }
      .language { color: var(--blue); background: #edf3ff; border: 0; cursor: pointer; }
      .contact:focus-visible, .language:focus-visible { outline: 3px solid #82a8ff; outline-offset: 4px; }

      [dir="rtl"] h1 { letter-spacing: 0; }

      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes float { 50% { transform: translateY(-10px); } }

      @media (max-width: 600px) {
        main { padding: 18px; }
        .card { padding: 28px 20px; border-radius: 22px; }
        .illustration { height: 205px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .wash, .bubble { animation: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-labelledby="status-title">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">PL</span>
          <span>
            <span data-en="PEARL LAUNDRY" data-ar="مغسلة بيرل">PEARL LAUNDRY</span>
            <small data-en="LAUNDRY &amp; GARMENT CARE" data-ar="العناية بالملابس والمفروشات">LAUNDRY &amp; GARMENT CARE</small>
          </span>
        </div>

        <div class="illustration" aria-hidden="true">
          <span class="bubble one"></span>
          <span class="bubble two"></span>
          <span class="bubble three"></span>
          <span class="wrench">⌁</span>
          <span class="spark">✦</span>
          <div class="machine"><div class="door"><span class="wash"></span></div></div>
        </div>

        <p class="eyebrow" data-en="TEMPORARILY UNAVAILABLE" data-ar="غير متاح مؤقتاً">TEMPORARILY UNAVAILABLE</p>
        <h1 id="status-title" data-en="We are giving the site a fresh press." data-ar="نقوم بتحديث الموقع.">We are giving the site a fresh press.</h1>
        <p
          class="message"
          data-en="Pearl Laundry is carrying out a brief update. Please come back shortly."
          data-ar="تجري مغسلة بيرل تحديثاً قصيراً للموقع. يرجى زيارتنا مجدداً قريباً."
        >Pearl Laundry is carrying out a brief update. Please come back shortly.</p>

        <div class="actions">
          <a
            class="contact"
            href="mailto:pearllaundrysupport@gmail.com"
            data-en="Contact us"
            data-ar="تواصل معنا"
          >Contact us</a>
          <button class="language" type="button" aria-label="عرض الصفحة بالعربية">العربية</button>
        </div>
      </section>
    </main>

    <script>
      const button = document.querySelector(".language");
      const translatable = document.querySelectorAll("[data-en][data-ar]");
      let arabic = false;

      button.addEventListener("click", () => {
        arabic = !arabic;
        document.documentElement.lang = arabic ? "ar" : "en";
        document.documentElement.dir = arabic ? "rtl" : "ltr";
        document.title = arabic
          ? "مغسلة بيرل | غير متاح مؤقتاً"
          : "Pearl Laundry | Temporarily unavailable";
        translatable.forEach((element) => {
          element.textContent = arabic ? element.dataset.ar : element.dataset.en;
        });
        button.textContent = arabic ? "English" : "العربية";
        button.setAttribute(
          "aria-label",
          arabic ? "View this page in English" : "عرض الصفحة بالعربية"
        );
      });
    </script>
  </body>
</html>
